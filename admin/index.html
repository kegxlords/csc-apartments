<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations Console · Pinnacle Apartments</title>
<meta name="theme-color" content="#123A8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css?v=2">
<link rel="stylesheet" href="../assets/css/layout.css?v=2">
<link rel="stylesheet" href="../assets/css/components.css?v=2">
<link rel="stylesheet" href="../assets/css/admin.css?v=2">
</head>
<body class="console" data-page="console">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">Console</div>
</div></div>

<header class="console-bar">
  <div class="console-bar-in">
    <a class="crest" href="#overview" data-act="tab" data-tab="overview">
      <span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.2"/><rect x="11" y="18" width="6" height="6" fill="#FFD9EC"/><rect x="23" y="18" width="6" height="6" fill="#fff" opacity=".8"/><rect x="11" y="27" width="6" height="6" fill="#fff" opacity=".6"/><rect x="23" y="27" width="6" height="6" fill="#FFD9EC"/></svg></span>
      <span class="crest-txt"><b>PINNACLE</b><i>Apartments</i></span>
    </a>
    <span class="console-tag">Operations</span>
    <span style="flex:1"></span>
    <span class="console-clock" id="clock">—</span>
    <button class="icon-btn" type="button" data-act="sweep" aria-label="Run income sweep" title="Run income sweep">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
    </button>
    <a class="icon-btn" href="../dashboard.html" aria-label="Open member app" title="Open member app">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    </a>
    <button class="icon-btn" type="button" data-act="signout" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="imp-bar hide" id="impBar">
  <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M12 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0 2c4 0 8 1.8 8 4.4V21H4v-2.6C4 15.8 8 14 12 14z"/></svg>
  <div><b id="impName">Member</b> <span>· viewing as this member — actions are logged</span></div>
  <button class="btn btn--sm" type="button" data-act="exit-imp" style="background:rgba(255,255,255,.24);color:#fff">Exit view</button>
</div>

<nav class="tab-rail"><div class="tab-rail-in" id="tabs"></div></nav>

<main class="console-main" id="view"></main>

<div class="save-bar" id="saveBar">
  <svg viewBox="0 0 24 24" fill="currentColor" style="width:19px;height:19px"><path d="M12 2L1 21h22zm0 6v7m0 3v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  <b>Unsaved settings</b>
  <button class="btn btn--sm" type="button" data-act="settings-discard" style="background:rgba(255,255,255,.22);color:#fff">Discard</button>
  <button class="btn btn--green btn--sm" type="button" data-act="settings-save">Save changes</button>
</div>

<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/admin-store.js?v=2"></script>
<script src="../assets/js/app.js?v=2"></script>
<script src="../assets/js/qr.js?v=2"></script>
<script src="../assets/js/admin.js?v=2"></script>
</body>
</html>
