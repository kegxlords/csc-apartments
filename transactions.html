<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactions · Pinnacle Apartments</title>
<meta name="theme-color" content="#1F6FEB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:12px}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .sum{padding:14px 10px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1)}
  .sum .k{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
  .sum .v{font-family:var(--font-display);font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
  .toolbar{display:flex;gap:9px;margin-bottom:12px}
  .toolbar .input-wrap{flex:1}
</style>
</head>
<body data-page="transactions">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">Pinnacle</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">Account ledger</span>
      <h1>Transaction History</h1>
    </div>

    <div class="sum-grid rise rise-2" id="sums"></div>

    <div class="toolbar rise rise-3">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="input" id="search" placeholder="Search description or reference">
      </div>
      <button class="btn btn--ghost btn--sm" type="button" id="export">Export</button>
    </div>

    <div class="chips rise rise-3" id="chips"></div>

    <div class="card rise rise-4"><div class="rows" id="list"></div></div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/actions.js"></script>
<script src="assets/js/transactions.js"></script>
</body>
</html>
