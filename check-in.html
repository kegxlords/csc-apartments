<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Check-In · Pinnacle Apartments</title>
<meta name="theme-color" content="#EC2E86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .tier-ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .tier{padding:14px 8px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1.5px solid var(--hairline)}
  .tier.on{background:var(--g-pink);color:#fff;border-color:transparent;box-shadow:var(--sh-pink)}
  .tier b{font-family:var(--font-display);font-size:19px;font-weight:800;display:block}
  .tier span{font-size:10.5px;font-weight:700;opacity:.85}
  .claim-hero{text-align:center;padding:24px 18px;border-radius:var(--r-lg);background:var(--g-pink);color:#fff;box-shadow:var(--sh-pink);margin-bottom:16px}
  .claim-hero .amt{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .claim-hero .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
</style>
</head>
<body data-page="checkin">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">Pinnacle</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">Daily reward</span>
      <h1>Check-In</h1>
    </div>
    <div id="streak" class="rise rise-2"></div>
    <div id="claim" class="rise rise-3"></div>
    <div class="card rise rise-4" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px">Streak boosts</h3>
      <div class="tier-ladder" id="ladder"></div>
      <p class="c-muted" style="font-size:12px;font-weight:600">Attendance is a bonus on top of your rental income. Missing a day resets the streak — your 24-hour drops continue regardless.</p>
    </div>
    <div class="card rise rise-5" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px" id="calTitle">This month</h3>
      <div class="cal" id="cal"></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;font-weight:700" class="c-muted">
        <span style="display:flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:var(--g-green);display:inline-block"></i> Checked in</span>
        <span style="display:flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:var(--red-tint);border:1px solid rgba(226,59,51,.3);display:inline-block"></i> Missed</span>
        <span style="display:flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:3px;border:2px solid var(--pink);display:inline-block"></i> Today</span>
      </div>
    </div>
    <div class="card rise rise-6">
      <h3 style="margin-bottom:6px">Recent attendance</h3>
      <div class="rows" id="recent"></div>
    </div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/actions.js"></script>
<script src="assets/js/checkin.js"></script>
</body>
</html>
