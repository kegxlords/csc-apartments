<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Pinnacle Apartments</title>
<meta name="theme-color" content="#1F6FEB">
<meta name="description" content="Your Pinnacle Apartments resident portal — lease a residence and earn income every 24 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .greet-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .greet-row .eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:2px}
</style>
</head>
<body data-page="dashboard">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">Pinnacle</div>
</div></div>

<div class="app">
  <header id="hdr"></header>

  <main class="main">
    <div class="greet-row rise rise-1">
      <div>
        <span class="eyebrow">Resident portal</span>
        <h1 style="font-size:26px">Hello, <span id="greet">Member</span></h1>
      </div>
    </div>

    <section class="sec rise rise-2"><div class="carousel" id="carousel"></div></section>

    <section class="sec rise rise-3">
      <div class="balance">
        <div class="balance-cell"><div class="k">Available balance</div><div class="v c-blue" id="balMain">₦0</div></div>
        <div class="balance-sep"></div>
        <div class="balance-cell"><div class="k">Income balance</div><div class="v c-green" id="balIncome">₦0</div></div>
        <button class="balance-hist" id="histBtn" type="button">
          History
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <section class="sec rise rise-4"><div class="qa" id="qa"></div></section>

    <section class="sec rise rise-5">
      <div class="sec-head">
        <div><span class="eyebrow">Now leasing</span><h2>Available Residences</h2></div>
        <a class="sec-link" href="rents.html">My leases
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="units" id="units"></div>
    </section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Rewards and referral codes">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13M12 8S9.5 3 7.5 4.5 9 8 12 8s4.5-2 2.5-3.5S12 8 12 8z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span class="spark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></span>
  </button>

  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js?v=20261118-1"></script>
<script src="assets/js/app.js?v=20261118-1"></script>
<script src="assets/js/actions.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
