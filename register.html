<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account · CSC Apartments</title>
<meta name="theme-color" content="#EC2E86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=3">
<link rel="stylesheet" href="assets/css/layout.css?v=3">
<link rel="stylesheet" href="assets/css/components.css?v=3">
</head>
<body data-page="register">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">CSC</div>
</div></div>

<main class="main main--auth">
  <div class="auth-hero" id="hero"></div>

  <div class="auth-wrap">
    <section class="auth-card rise rise-1">
      <h1 class="auth-title grad-text">Join Us Today!</h1>
      <p class="auth-sub">Create your account and start earning</p>

      <div class="alert" id="alert" role="status" aria-live="polite"></div>

      <form id="regForm" novalidate>
        <div class="field-row">
          <label class="label" for="name">Full Name</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0 2c4 0 8 1.8 8 4.4V21H4v-2.6C4 15.8 8 14 12 14z"/></svg>
            <input class="input" id="name" autocomplete="name" placeholder="Adaeze Okonkwo" required>
          </div>
        </div>

        <div class="field-row">
          <label class="label" for="email">Email Address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5h20v14H2zm0 0l10 8L22 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field-row">
          <label class="label" for="captcha">Captcha Verification</label>
          <div class="captcha">
            <div class="input-wrap" id="capWrap">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg>
              <input class="input" id="captcha" inputmode="numeric" maxlength="4" placeholder="4 digits" required>
            </div>
            <div class="captcha-plate"><canvas id="capCanvas" width="112" height="50" aria-label="Captcha image"></canvas></div>
            <button class="captcha-refresh" type="button" id="capRefresh" aria-label="New captcha">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
            <input class="input" id="password" type="password" autocomplete="new-password" placeholder="Min 6 characters" required>
            <button class="eye" type="button" data-eye="password">Show</button>
          </div>
          <div class="strength" id="meter"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="field-row">
          <label class="label" for="invite">Invitation Code <span class="opt">(optional)</span></label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zm6 1v8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input class="input input--code" id="invite" placeholder="PNCXXX" maxlength="12">
          </div>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Create Account</button>
      </form>

      <p class="auth-foot">Already a resident? <a href="index.html">Sign In</a></p>
      <div class="auth-bonus">🎁 New members receive <b id="bonusAmt">₦500.00</b> welcome bonus instantly.</div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=4"></script>
<script src="assets/js/app.js?v=3"></script>
<script src="assets/js/auth.js?v=3"></script>
</body>
</html>
