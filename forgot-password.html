<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Access · Pinnacle Apartments</title>
<meta name="theme-color" content="#1F6FEB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="forgot">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">Pinnacle</div>
</div></div>

<main class="main main--auth">
  <div class="auth-hero" id="hero"></div>

  <div class="auth-wrap">
    <section class="auth-card rise rise-1">
      <h1 class="auth-title">Recover Access</h1>
      <p class="auth-sub">We’ll email you a secure reset link</p>

      <div class="alert" id="alert" role="status" aria-live="polite"></div>

      <form id="forgotForm" novalidate>
        <div class="field-row">
          <label class="label" for="email">Email Address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5h20v14H2zm0 0l10 8L22 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <p class="hint">Use the address you registered with.</p>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Send Reset Link</button>
      </form>

      <p class="auth-foot">Remembered it? <a href="index.html">Back to Sign In</a></p>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js?v=20261118-1"></script>
<script src="assets/js/app.js?v=20261118-1"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
